# Builds the desktop app on Windows and Linux and the Android app, and publishes a GitHub Release.
#
# Push a tag such as v1.0.0 (it must match __version__ in lightninglan/__init__.py) to build and
# release. "Run workflow" on the Actions tab builds without releasing; the files are then
# attached to the run as artifacts.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            asset: dist/LightningLAN.exe
          # macOS is not released yet (never tested on a Mac). To add it, uncomment:
          # - name: macOS
          #   os: macos-14  # Apple silicon
          #   asset: dist/LightningLAN-macOS.zip
          - name: Linux
            os: ubuntu-22.04  # the oldest glibc we build on is the oldest one the binary runs on
            asset: dist/LightningLAN-linux-x86_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check that the tag matches the app version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version=$(python -c "import re; print(re.search(r'__version__ = \"(.+?)\"', open('lightninglan/__init__.py').read())[1])")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match __version__ = $version in lightninglan/__init__.py"
            exit 1
          fi

      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-build.txt

      - name: Unit tests
        run: python -m pytest -m "not integration" -q

      - name: Build and smoke-test the app
        run: python build.py --smoke-test

      - uses: actions/upload-artifact@v4
        with:
          name: LightningLAN-${{ matrix.name }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  android:
    name: Build (Android)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      # Releases are signed with the key in the ANDROID_KEYSTORE_BASE64 secret (a base64 PKCS12
      # keystore, alias "lightninglan") and ANDROID_KEYSTORE_PASSWORD. Phones only accept an update
      # signed with the same key, so it must never change.
      - name: Test, build and sign the APK
        working-directory: android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          LIGHTNINGLAN_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            export LIGHTNINGLAN_KEYSTORE="$RUNNER_TEMP/release.jks"
          elif [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "::error::The ANDROID_KEYSTORE_BASE64 secret is missing, so the APK can't be signed"
            exit 1
          fi
          ./gradlew --no-daemon :core:test :app:assembleRelease
          mkdir -p ../dist
          cp app/build/outputs/apk/release/app-release*.apk ../dist/LightningLAN-android.apk
          rm -f "$RUNNER_TEMP/release.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: LightningLAN-Android
          path: dist/LightningLAN-android.apk
          if-no-files-found: error

  release:
    name: Publish the GitHub Release
    needs: [build, android]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<EOF
          **Download the file for your computer or phone:**

          | Device | File |
          | --- | --- |
          | Windows 10 or 11 | \`LightningLAN.exe\` |
          | Linux (64-bit PC) | \`LightningLAN-linux-x86_64\` |
          | Android 8 or newer | \`LightningLAN-android.apk\` |

          There is no Mac version yet. iPhones can join from the browser: scan the QR code in
          LightningLAN on a computer.

          First time? The app is not signed, so Windows will warn you before opening it, and
          Android asks you to allow installing apps from your browser.
          [INSTALL.md](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/INSTALL.md)
          explains each step in plain language.
          EOF
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "LightningLAN $GITHUB_REF_NAME" \
            --notes-file notes.md \
            --generate-notes
